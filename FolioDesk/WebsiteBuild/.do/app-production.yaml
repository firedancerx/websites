name: foliodesk-production
region: sgp
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: web
    environment_slug: node-js
    github:
      repo: firedancerx/websites
      branch: main
      deploy_on_push: false
    source_dir: /FolioDesk/WebsiteBuild
    build_command: npm ci && npm run build
    run_command: npm run start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_PRIVATE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_SSL_MODE
        value: verify-ca
        scope: RUN_TIME
      - key: DATABASE_POOL_SIZE
        value: "20"
        scope: RUN_TIME
      - key: SESSION_SECRET
        value: e8aa68496d9503e0aec1b7ec4b5aad26b07c10963f13358b33c353d4a835d89
        scope: RUN_TIME
        type: SECRET
      - key: NEXT_PUBLIC_SITE_URL
        value: https://example.com/foliodesk
        scope: RUN_AND_BUILD_TIME
      - key: FILE_STORAGE_PROVIDER
        value: spaces
        scope: RUN_TIME
      - key: SPACES_ENDPOINT
        value: https://tor1.digitaloceanspaces.com
        scope: RUN_TIME
      - key: SPACES_REGION
        value: tor1
        scope: RUN_TIME
      - key: SPACES_BUCKET
        value: flameaters-spaces-02
        scope: RUN_TIME
      - key: SPACES_ACCESS_KEY
        value: DO801HZ7EG4RZH3VTF3Q9Q
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_SECRET_KEY
        value: olgyLpTp/PYrXdmGuwNjaYvYlxlEth86YWLb40dOOJM
        scope: RUN_TIME
        type: SECRET
jobs:
  - name: schema-migrate
    kind: PRE_DEPLOY
    environment_slug: node-js
    github:
      repo: firedancerx/websites
      branch: main
      deploy_on_push: false
    source_dir: /FolioDesk/WebsiteBuild
    build_command: npm ci --ignore-scripts
    run_command: npm run db:migrate && npm run db:verify
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_PRIVATE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_SSL_MODE
        value: verify-ca
        scope: RUN_TIME
databases:
  - name: db
    engine: MYSQL
    version: "8.4"
    production: true
    cluster_name: foliodesk-marketing-db
    db_name: foliodesk
    db_user: doadmin
